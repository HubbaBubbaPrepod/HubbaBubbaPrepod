<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="imBg" x1="35" y1="18" x2="1160" y2="402" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020705"/>
      <stop offset="0.52" stop-color="#07110D"/>
      <stop offset="1" stop-color="#0B1711"/>
    </linearGradient>
    <radialGradient id="imGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(939 209) scale(389 310)">
      <stop stop-color="#39FF88" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#39FF88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="imAccent" x1="63" y1="0" x2="666" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39FF88"/>
      <stop offset="1" stop-color="#9DFFBE"/>
    </linearGradient>
    <pattern id="imGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#39FF88" stroke-opacity="0.038"/>
    </pattern>
    <filter id="imSoft" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="imClip"><rect x="10" y="10" width="1180" height="400" rx="27"/></clipPath>
    <clipPath id="rainClip"><rect x="730" y="10" width="460" height="400"/></clipPath>
  </defs>

  <g clip-path="url(#imClip)">
    <rect x="10" y="10" width="1180" height="400" rx="27" fill="url(#imBg)"/>
    <rect x="10" y="10" width="1180" height="400" rx="27" fill="url(#imGrid)"/>
    <rect x="10" y="10" width="1180" height="400" rx="27" fill="url(#imGlow)"/>

    <g clip-path="url(#rainClip)" font-family="Consolas, Menlo, monospace" font-size="12" fill="#39FF88">
      <text x="760" y="-40" opacity="0.12">01 10 11 00 10 01 11 01<animate attributeName="y" values="-60;470" dur="8s" repeatCount="indefinite"/></text>
      <text x="824" y="-160" opacity="0.17">synapse postgres coturn<animate attributeName="y" values="-160;500" dur="10s" repeatCount="indefinite"/></text>
      <text x="901" y="-80" opacity="0.11">101101001011001101<animate attributeName="y" values="-80;480" dur="7s" repeatCount="indefinite"/></text>
      <text x="978" y="-240" opacity="0.2">TLS FEDERATION RTC<animate attributeName="y" values="-240;490" dur="11s" repeatCount="indefinite"/></text>
      <text x="1051" y="-120" opacity="0.13">00101101001011010<animate attributeName="y" values="-120;500" dur="9s" repeatCount="indefinite"/></text>
      <text x="1122" y="-300" opacity="0.15">backup restore deploy<animate attributeName="y" values="-300;470" dur="12s" repeatCount="indefinite"/></text>
    </g>

    <g transform="translate(62 48)" font-family="Consolas, Menlo, monospace">
      <rect width="128" height="28" rx="14" fill="#39FF88" fill-opacity="0.1" stroke="#39FF88" stroke-opacity="0.32"/>
      <text x="64" y="18" text-anchor="middle" fill="#9DFFBE" font-size="10" font-weight="700" letter-spacing="1.8">FEATURED / 01</text>
      <circle cx="161" cy="14" r="4" fill="#39FF88" filter="url(#imSoft)"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="176" y="18" fill="#7D9B87" font-size="10" font-weight="700" letter-spacing="1.4">PRODUCTION READY · RELEASE v4.1.0</text>

      <text y="88" fill="url(#imAccent)" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="900" letter-spacing="-2.4">INSTALL—MATRIX</text>
      <text y="119" fill="#A8B9AE" font-size="14" letter-spacing="0.5">ONE INSTALLER. A COMPLETE MATRIX HOMESERVER.</text>

      <text y="164" fill="#E6EDF3" font-size="16" font-weight="700">Synapse + PostgreSQL + Coturn + Nginx</text>
      <text y="190" fill="#718079" font-size="13">Secure defaults, TLS, federation, backups, rollback,</text>
      <text y="211" fill="#718079" font-size="13">MatrixRTC / LiveKit and reproducible CLI automation.</text>

      <g transform="translate(0 241)" font-size="10" font-weight="700" letter-spacing="1">
        <g><rect width="92" height="28" rx="7" fill="#0C1D14" stroke="#1D5737"/><text x="46" y="18" text-anchor="middle" fill="#9DFFBE">SHELL</text></g>
        <g transform="translate(102)"><rect width="92" height="28" rx="7" fill="#0C1D14" stroke="#1D5737"/><text x="46" y="18" text-anchor="middle" fill="#9DFFBE">DOCKER</text></g>
        <g transform="translate(204)"><rect width="112" height="28" rx="7" fill="#0C1D14" stroke="#1D5737"/><text x="56" y="18" text-anchor="middle" fill="#9DFFBE">POSTGRESQL</text></g>
        <g transform="translate(326)"><rect width="88" height="28" rx="7" fill="#0C1D14" stroke="#1D5737"/><text x="44" y="18" text-anchor="middle" fill="#9DFFBE">NGINX</text></g>
      </g>

      <g transform="translate(0 302)">
        <path d="M0 0H526" stroke="#39FF88" stroke-opacity="0.24"/>
        <text y="29" fill="#39FF88" font-size="11" font-weight="700" letter-spacing="1.6">VIEW REPOSITORY</text>
        <path d="M144 24H184M178 18L184 24L178 30" stroke="#39FF88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="1.5s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <g transform="translate(747 82)" font-family="Consolas, Menlo, monospace">
      <rect width="390" height="273" rx="16" fill="#040806" fill-opacity="0.96" stroke="#245A3B"/>
      <path d="M0 42H390" stroke="#183A28"/>
      <circle cx="20" cy="21" r="4" fill="#39FF88"/><circle cx="36" cy="21" r="4" fill="#1A5C35"/><circle cx="52" cy="21" r="4" fill="#123C25"/>
      <text x="195" y="25" text-anchor="middle" fill="#476753" font-size="9" letter-spacing="1.4">MATRIX DEPLOYMENT STREAM</text>
      <g font-size="12">
        <text x="20" y="72" fill="#39FF88">$</text><text x="38" y="72" fill="#D7E7DC">sudo ./install-matrix.sh install</text>
        <text x="20" y="103" fill="#39FF88">✓</text><text x="43" y="103" fill="#91A99A">PostgreSQL</text><text x="341" y="103" fill="#39FF88">OK</text>
        <text x="20" y="130" fill="#39FF88">✓</text><text x="43" y="130" fill="#91A99A">Synapse homeserver</text><text x="341" y="130" fill="#39FF88">OK</text>
        <text x="20" y="157" fill="#39FF88">✓</text><text x="43" y="157" fill="#91A99A">Coturn + TLS</text><text x="341" y="157" fill="#39FF88">OK</text>
        <text x="20" y="184" fill="#39FF88">✓</text><text x="43" y="184" fill="#91A99A">Federation API</text><text x="341" y="184" fill="#39FF88">OK</text>
        <text x="20" y="211" fill="#39FF88">✓</text><text x="43" y="211" fill="#91A99A">Backup / rollback</text><text x="341" y="211" fill="#39FF88">OK</text>
        <rect x="20" y="232" width="350" height="22" rx="5" fill="#39FF88" fill-opacity="0.08"/>
        <rect x="20" y="232" width="350" height="22" rx="5" fill="#39FF88" fill-opacity="0.22">
          <animate attributeName="width" values="0;350;350" keyTimes="0;.8;1" dur="3.4s" repeatCount="indefinite"/>
        </rect>
        <text x="195" y="247" text-anchor="middle" fill="#B8FFD0" font-size="9" font-weight="700" letter-spacing="1.2">DEPLOYMENT VERIFIED</text>
      </g>
    </g>
  </g>

  <rect x="10.75" y="10.75" width="1178.5" height="398.5" rx="26.25" stroke="#39FF88" stroke-opacity="0.42" stroke-width="1.5"/>
</svg>
