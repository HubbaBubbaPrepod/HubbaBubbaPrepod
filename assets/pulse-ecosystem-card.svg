<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Pulse — self-hosted monitoring ecosystem</title>
  <defs>
    <linearGradient id="pBg" x1="10" y1="10" x2="1190" y2="410" gradientUnits="userSpaceOnUse"><stop stop-color="#090909"/><stop offset="1" stop-color="#171717"/></linearGradient>
    <pattern id="pGrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#FFF" stroke-opacity=".025"/></pattern>
    <clipPath id="pClip"><rect x="10" y="10" width="1180" height="400" rx="27"/></clipPath>
    <path id="pAgent" d="M737 312V286Q737 277 746 277H883Q892 277 892 268V250"/>
    <path id="pDocker" d="M909 312V250"/>
    <path id="pWebsite" d="M1081 312V286Q1081 277 1072 277H935Q926 277 926 268V250"/>
    <path id="pWave" d="M0 38H42L52 38L62 26L74 56L87 10L101 38H156L166 30L178 46L190 38H350"/>
  </defs>
  <g clip-path="url(#pClip)">
    <rect x="10" y="10" width="1180" height="400" rx="27" fill="url(#pBg)"/>
    <rect x="10" y="10" width="1180" height="400" fill="url(#pGrid)"/>
    <path d="M615 45V375" stroke="#FFF" stroke-opacity=".08"/>
    <g transform="translate(62 48)" font-family="Consolas, Menlo, monospace">
      <rect width="128" height="28" rx="14" fill="#FFF" fill-opacity=".06" stroke="#454545"/>
      <text x="64" y="18" text-anchor="middle" fill="#D9D9D9" font-size="10" font-weight="700" letter-spacing="1.8">FEATURED / 01</text>
      <circle cx="157" cy="14" r="3" fill="#FFF"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="171" y="18" fill="#9D9D9D" font-size="10" letter-spacing="1">PUBLIC · SELF-HOSTED</text>
      <text y="102" fill="#FAFAFA" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" letter-spacing="-3">PULSE</text>
      <text y="132" fill="#AFAFAF" font-size="12" letter-spacing="2.3">YOUR INFRASTRUCTURE. IN FOCUS.</text>
      <text y="181" fill="#E7E7E7" font-size="16" font-weight="700">One stack. Four connected projects.</text>
      <text y="208" fill="#A0A0A0" font-size="13">Servers, processes, logs and Docker workloads.</text>
      <text y="230" fill="#A0A0A0" font-size="13">Live telemetry on Linux and Windows.</text>
      <g transform="translate(0 257)" font-size="10" font-weight="700" fill="#DADADA" text-anchor="middle">
        <rect width="52" height="28" rx="7" fill="#191919" stroke="#404040"/><text x="26" y="18">GO</text>
        <rect x="62" width="104" height="28" rx="7" fill="#191919" stroke="#404040"/><text x="114" y="18">NEXT.JS 16</text>
        <rect x="176" width="94" height="28" rx="7" fill="#191919" stroke="#404040"/><text x="223" y="18">REACT 19</text>
        <rect x="280" width="76" height="28" rx="7" fill="#191919" stroke="#404040"/><text x="318" y="18">DOCKER</text>
        <rect x="366" width="72" height="28" rx="7" fill="#191919" stroke="#404040"/><text x="402" y="18">HTTPS</text>
      </g>
      <path d="M0 312H492" stroke="#333"/>
      <text y="340" fill="#EDEDED" font-size="11" font-weight="700" letter-spacing="1.5">EXPLORE THE ECOSYSTEM</text>
      <path d="M220 335H253M247 329L253 335L247 341" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2s" repeatCount="indefinite"/></path>
    </g>
    <g font-family="Consolas, Menlo, monospace">
      <g transform="translate(658 48)">
        <rect width="502" height="202" rx="15" fill="#0C0C0C" stroke="#555"/>
        <path d="M0 41H502" stroke="#343434"/>
        <circle cx="19" cy="21" r="3" fill="#FFF"/><circle cx="31" cy="21" r="3" fill="#777"/><circle cx="43" cy="21" r="3" fill="#444"/>
        <text x="65" y="25" fill="#EDEDED" font-size="11" font-weight="700" letter-spacing="1.3">PULSE MONITOR</text>
        <text x="481" y="25" text-anchor="end" fill="#999" font-size="9">SELF-HOSTED / LIVE</text>
        <g transform="translate(16 57)">
