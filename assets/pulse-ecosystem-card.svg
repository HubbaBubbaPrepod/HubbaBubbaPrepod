<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseBg" x1="24" y1="16" x2="1178" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020706"/>
      <stop offset="0.5" stop-color="#06110D"/>
      <stop offset="1" stop-color="#07141A"/>
    </linearGradient>
    <linearGradient id="pulseTitle" x1="62" y1="0" x2="575" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3FFF7"/>
      <stop offset="0.56" stop-color="#9DFFBE"/>
      <stop offset="1" stop-color="#38D9FF"/>
    </linearGradient>
    <radialGradient id="pulseAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(931 216) scale(430 330)">
      <stop stop-color="#39FF88" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#38D9FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#38D9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pulseGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#39FF88" stroke-opacity="0.035"/>
    </pattern>
    <filter id="pulseGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pulseRedGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pulseClip"><rect x="10" y="10" width="1180" height="420" rx="27"/></clipPath>
    <path id="agentRoute" d="M813 126C833 142 846 151 865 166"/>
    <path id="webRoute" d="M1050 126C1031 143 1018 152 999 166"/>
    <path id="dockerRoute" d="M820 344C843 326 852 314 871 298"/>
  </defs>

  <g clip-path="url(#pulseClip)">
    <rect x="10" y="10" width="1180" height="420" rx="27" fill="url(#pulseBg)"/>
    <rect x="10" y="10" width="1180" height="420" rx="27" fill="url(#pulseGrid)"/>
    <rect x="10" y="10" width="1180" height="420" rx="27" fill="url(#pulseAura)"/>

    <path d="M13 350H160L174 350L184 335L197 378L210 319L225 350H364L375 350L386 342L397 359L409 350H605"
          stroke="#39FF88" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M13 350H160L174 350L184 335L197 378L210 319L225 350H364L375 350L386 342L397 359L409 350H605"
          stroke="#39FF88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="92 620" filter="url(#pulseGlow)">
      <animate attributeName="stroke-dashoffset" values="712;0" dur="3.8s" repeatCount="indefinite"/>
    </path>

    <g transform="translate(62 46)" font-family="Consolas, Menlo, monospace">
      <rect width="139" height="28" rx="14" fill="#39FF88" fill-opacity="0.1" stroke="#39FF88" stroke-opacity="0.38"/>
      <text x="69.5" y="18" text-anchor="middle" fill="#9DFFBE" font-size="10" font-weight="700" letter-spacing="1.7">FEATURED / 01</text>
      <circle cx="171" cy="14" r="4" fill="#39FF88" filter="url(#pulseGlow)">
        <animate attributeName="opacity" values="1;.25;1" dur="1.55s" repeatCount="indefinite"/>
      </circle>
      <text x="186" y="18" fill="#789587" font-size="10" font-weight="700" letter-spacing="1.35">4 PUBLIC REPOSITORIES · SELF-HOSTED</text>

      <text y="92" fill="url(#pulseTitle)" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" letter-spacing="-2">PULSE ECOSYSTEM</text>
      <text y="126" fill="#A1B8AD" font-size="14" letter-spacing="0.45">REAL-TIME TELEMETRY. YOUR NODES. YOUR DATA.</text>

      <text y="171" fill="#F1FFF6" font-size="16" font-weight="700">One observability stack. Four connected projects.</text>
      <text y="198" fill="#72877D" font-size="13">Monitor servers, processes, disks, connections, logs,</text>
      <text y="220" fill="#72877D" font-size="13">GPU metrics and Docker workloads from a single control plane.</text>

      <g transform="translate(0 250)" font-size="10" font-weight="700" letter-spacing="1">
        <g><rect width="70" height="28" rx="7" fill="#0A1912" stroke="#225F40"/><text x="35" y="18" text-anchor="middle" fill="#9DFFBE">GO</text></g>
        <g transform="translate(80)"><rect width="106" height="28" rx="7" fill="#0A1912" stroke="#225F40"/><text x="53" y="18" text-anchor="middle" fill="#9DFFBE">NEXT.JS 16</text></g>
        <g transform="translate(196)"><rect width="94" height="28" rx="7" fill="#0A1912" stroke="#225F40"/><text x="47" y="18" text-anchor="middle" fill="#9DFFBE">REACT 19</text></g>
        <g transform="translate(300)"><rect width="88" height="28" rx="7" fill="#0A1912" stroke="#225F40"/><text x="44" y="18" text-anchor="middle" fill="#9DFFBE">DOCKER</text></g>
        <g transform="translate(398)"><rect width="78" height="28" rx="7" fill="#0A1912" stroke="#225F40"/><text x="39" y="18" text-anchor="middle" fill="#9DFFBE">HTTPS</text></g>
      </g>

      <g transform="translate(0 330)">
        <path d="M0 0H512" stroke="#39FF88" stroke-opacity="0.25"/>
        <text y="29" fill="#39FF88" font-size="11" font-weight="700" letter-spacing="1.6">OPEN PULSE CONTROL PLANE</text>
        <path d="M218 24H258M252 18L258 24L252 30" stroke="#39FF88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="1.5s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <g font-family="Consolas, Menlo, monospace">
      <path d="M813 126C833 142 846 151 865 166M1050 126C1031 143 1018 152 999 166M820 344C843 326 852 314 871 298"
            stroke="#39FF88" stroke-opacity="0.33" stroke-width="1.5" stroke-dasharray="4 5"/>

      <g transform="translate(674 70)">
        <rect width="166" height="58" rx="12" fill="#07140E" stroke="#277348"/>
        <circle cx="19" cy="20" r="5" fill="#39FF88" fill-opacity="0.17" stroke="#39FF88"/>
        <path d="M16 20H22M19 17V23" stroke="#9DFFBE" stroke-width="1.2"/>
        <text x="34" y="23" fill="#DFFFF0" font-size="11" font-weight="700" letter-spacing="1.3">AGENT</text>
        <text x="17" y="43" fill="#607D6D" font-size="8.5" letter-spacing="0.7">LINUX · WINDOWS · OUTBOUND</text>
      </g>

      <g transform="translate(1022 70)">
        <rect width="144" height="58" rx="12" fill="#071319" stroke="#25677A"/>
        <circle cx="19" cy="20" r="5" fill="#38D9FF" fill-opacity="0.16" stroke="#38D9FF"/>
        <path d="M15 20H23M19 16V24" stroke="#8DEBFF" stroke-width="1.2"/>
        <text x="34" y="23" fill="#E6FAFF" font-size="11" font-weight="700" letter-spacing="1.3">WEBSITE</text>
        <text x="17" y="43" fill="#5E7880" font-size="8.5" letter-spacing="0.7">NEXT 16 · REACT 19 · GSAP</text>
      </g>

      <g transform="translate(665 344)">
        <rect width="184" height="58" rx="12" fill="#07140E" stroke="#277348"/>
        <path d="M15 16H25V26H15ZM27 16H37V26H27ZM21 28H31V38H21Z" fill="#39FF88" fill-opacity="0.16" stroke="#39FF88" stroke-width="1"/>
        <text x="50" y="24" fill="#DFFFF0" font-size="11" font-weight="700" letter-spacing="1.15">DOCKER MODULE</text>
        <text x="50" y="43" fill="#607D6D" font-size="8.5" letter-spacing="0.65">CONTAINERS · LOGS · NETWORK</text>
      </g>

      <g transform="translate(848 145)">
        <rect width="246" height="174" rx="18" fill="#050D0A" stroke="#39FF88" stroke-opacity="0.62"/>
        <rect x="10" y="10" width="226" height="154" rx="12" fill="#07130F" stroke="#1E4D34"/>
        <path d="M10 45H236" stroke="#1C3E2D"/>
        <circle cx="26" cy="27" r="3" fill="#39FF88"/>
        <circle cx="38" cy="27" r="3" fill="#25613F"/>
        <circle cx="50" cy="27" r="3" fill="#173A28"/>
        <text x="123" y="30" text-anchor="middle" fill="#8CA79A" font-size="8.5" letter-spacing="1.4">PULSE MONITOR / CONTROL PLANE</text>

        <g transform="translate(24 59)">
          <text fill="#6F8B7C" font-size="8" letter-spacing="1">NODE HEALTH</text>
          <text x="182" fill="#39FF88" font-size="8" text-anchor="end" font-weight="700">ONLINE</text>
          <path d="M0 29H16L22 29L27 17L34 43L41 8L49 29H67L74 23L81 35L88 29H198" stroke="#39FF88" stroke-opacity="0.22" stroke-width="2"/>
          <path d="M0 29H16L22 29L27 17L34 43L41 8L49 29H67L74 23L81 35L88 29H198" stroke="#39FF88" stroke-width="2" stroke-linejoin="round" stroke-dasharray="35 250" filter="url(#pulseGlow)">
            <animate attributeName="stroke-dashoffset" values="285;0" dur="2.4s" repeatCount="indefinite"/>
          </path>
        </g>

        <g transform="translate(24 120)" font-size="8.5" font-weight="700" letter-spacing="0.8">
          <rect width="58" height="24" rx="6" fill="#0A1A12" stroke="#1E5135"/><text x="29" y="16" text-anchor="middle" fill="#8FE8AE">CPU 18%</text>
          <g transform="translate(68)"><rect width="61" height="24" rx="6" fill="#0A1A12" stroke="#1E5135"/><text x="30.5" y="16" text-anchor="middle" fill="#8FE8AE">RAM 42%</text></g>
          <g transform="translate(139)"><rect width="59" height="24" rx="6" fill="#0A1A12" stroke="#1E5135"/><text x="29.5" y="16" text-anchor="middle" fill="#8FE8AE">GPU 09%</text></g>
        </g>
      </g>

      <circle r="4" fill="#39FF88" filter="url(#pulseGlow)">
        <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#agentRoute"/></animateMotion>
      </circle>
      <circle r="4" fill="#38D9FF" filter="url(#pulseGlow)">
        <animateMotion dur="2.8s" begin="-.9s" repeatCount="indefinite"><mpath href="#webRoute"/></animateMotion>
      </circle>
      <circle r="4" fill="#39FF88" filter="url(#pulseGlow)">
        <animateMotion dur="2.5s" begin="-.6s" repeatCount="indefinite"><mpath href="#dockerRoute"/></animateMotion>
      </circle>

      <g transform="translate(1059 344)">
        <rect width="107" height="58" rx="12" fill="#15080B" stroke="#762332"/>
        <path d="M17 31L24 18L31 31Z" fill="#FF304C" fill-opacity="0.14" stroke="#FF304C"/>
        <path d="M24 22V27M24 29.5V30" stroke="#FF7A8B" stroke-width="1.5" stroke-linecap="round"/>
        <text x="42" y="24" fill="#FFB0BA" font-size="9" font-weight="700" letter-spacing="1">SECURITY</text>
        <text x="42" y="40" fill="#8A5158" font-size="8" letter-spacing=".7">HTTPS / TOKEN</text>
        <circle cx="95" cy="11" r="3" fill="#FF304C" filter="url(#pulseRedGlow)">
          <animate attributeName="opacity" values="1;.15;1" dur="1.3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <rect x="10" y="10" width="1180" height="420" rx="27" stroke="#39FF88" stroke-opacity="0.35"/>
  <path d="M37 10H222" stroke="#39FF88" stroke-width="2"/>
  <path d="M978 430H1163" stroke="#38D9FF" stroke-opacity="0.65" stroke-width="2"/>
</svg>
