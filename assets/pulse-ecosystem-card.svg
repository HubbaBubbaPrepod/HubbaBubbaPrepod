        <text x="79" y="24" fill="#F0F0F0" font-size="11" font-weight="700" letter-spacing="1.2">NATIVE AGENT</text>
        <text x="79" y="43" fill="#AAA" font-size="9">Linux · Windows</text>
      </g>
      <g transform="translate(830 312)" text-anchor="middle">
        <rect width="158" height="58" rx="10" fill="#111" stroke="#484848"/>
        <text x="79" y="24" fill="#F0F0F0" font-size="11" font-weight="700" letter-spacing="1.2">DOCKER MODULE</text>
        <text x="79" y="43" fill="#AAA" font-size="9">Containers · Logs</text>
      </g>
      <g transform="translate(1002 312)" text-anchor="middle">
        <rect width="158" height="58" rx="10" fill="#111" stroke="#484848"/>
        <text x="79" y="24" fill="#F0F0F0" font-size="11" font-weight="700" letter-spacing="1.2">PUBLIC WEBSITE</text>
        <text x="79" y="43" fill="#AAA" font-size="9">Next.js · React · GSAP</text>
      </g>
