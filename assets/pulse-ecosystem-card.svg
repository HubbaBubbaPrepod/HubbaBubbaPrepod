          <path d="M14 22H59M14 44H45M14 66H52M14 88H39M14 110H48" stroke="#666" stroke-width="3" stroke-linecap="round"/>
          <path d="M14 22H59" stroke="#EEE" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g transform="translate(108 58)">
          <text y="11" fill="#AFAFAF" font-size="9" letter-spacing="1.2">INFRASTRUCTURE OVERVIEW</text>
          <text x="374" y="11" text-anchor="end" fill="#DDD" font-size="9">CONNECTED</text>
          <path d="M0 40H374M0 64H374M0 88H374" stroke="#262626"/>
          <g transform="translate(12 23)">
            <use href="#pWave" stroke="#FFF" stroke-opacity=".22" stroke-width="2"/>
            <use href="#pWave" stroke="#FFF" stroke-width="2" stroke-linejoin="round" stroke-dasharray="65 400"><animate attributeName="stroke-dashoffset" values="465;0" dur="3.4s" repeatCount="indefinite"/></use>
          </g>
          <g transform="translate(0 99)" font-size="9" text-anchor="middle" fill="#DADADA">
            <rect width="118" height="28" rx="6" fill="#191919" stroke="#363636"/><text x="59" y="18">CPU / MEMORY</text>
            <rect x="128" width="118" height="28" rx="6" fill="#191919" stroke="#363636"/><text x="187" y="18">DISKS / GPU</text>
            <rect x="256" width="118" height="28" rx="6" fill="#191919" stroke="#363636"/><text x="315" y="18">LOGS / EVENTS</text>
          </g>
        </g>
      </g>
      <g stroke="#696969" stroke-width="1.3"><use href="#pAgent"/><use href="#pDocker"/><use href="#pWebsite"/></g>
      <g fill="#FFF">
        <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#pAgent"/></animateMotion></circle>
        <circle r="3"><animateMotion dur="2.3s" begin="-.8s" repeatCount="indefinite"><mpath href="#pDocker"/></animateMotion></circle>
        <circle r="3"><animateMotion dur="3.1s" begin="-1.4s" repeatCount="indefinite"><mpath href="#pWebsite"/></animateMotion></circle>
      </g>
      <g transform="translate(658 312)" text-anchor="middle">
